name: Build Turnip

on:
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: Mesa git repository
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      mesa_ref:
        description: Branch, tag or commit to build
        default: main
      patches:
        description: Newline-separated patch URLs or paths under patches/, applied in order
        default: ""
      variant_name:
        description: Driver name shown in GameNative and used for the zip name
        default: turnip-ci
      ndk:
        description: Android NDK version
        default: r28c
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MESA_REPO: ${{ inputs.mesa_repo || 'https://gitlab.freedesktop.org/mesa/mesa.git' }}
      MESA_REF: ${{ inputs.mesa_ref || 'main' }}
      PATCHES: ${{ inputs.patches }}
      VARIANT_NAME: ${{ inputs.variant_name || 'turnip-ci' }}
      NDK_VERSION: ${{ inputs.ndk || 'r28c' }}
      PACKAGE_VERSION: ${{ github.run_number }}
      WORKDIR: ${{ github.workspace }}/work
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build flex bison glslang-tools pkg-config zip unzip
          python3 -m pip install --user --upgrade meson mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        id: build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip_path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Mesa ${{ steps.build.outputs.mesa_version }} (${{ steps.build.outputs.mesa_commit }}) from $MESA_REPO @ $MESA_REF"
