name: Build Turnip

on:
  workflow_dispatch:
    inputs:
      mesa_repo:
        description: Mesa git repository
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      mesa_ref:
        description: Branch, tag or commit to build
        default: main
      patches:
        description: Newline-separated patch URLs or paths under patches/, applied in order
        default: ""
      variant_name:
        description: Driver name shown in GameNative and used for the zip name
        default: turnip-ci
      ndk:
        description: Android NDK version
        default: r28c
  workflow_call:
    inputs:
      mesa_repo:
        type: string
        default: https://gitlab.freedesktop.org/mesa/mesa.git
      mesa_ref:
        type: string
        default: main
      patches:
        type: string
        default: ""
      variant_name:
        type: string
        default: turnip-ci
      ndk:
        type: string
        default: r28c
      use_checkout:
        description: Build the calling repository's checked-out commit instead of cloning mesa_repo/mesa_ref
        type: boolean
        default: false
      artifact_name:
        description: Artifact name; defaults to the zip file name
        type: string
        default: ""
      turnip_ci_ref:
        description: turnip-ci ref whose build.sh is used when called from another repository
        type: string
        default: main
    secrets:
      turnip_ci_token:
        description: Token that can read GameNative/turnip-ci, needed when the caller's GITHUB_TOKEN cannot
        required: false
    outputs:
      zip_name:
        value: ${{ jobs.build.outputs.zip_name }}
      artifact_name:
        value: ${{ jobs.build.outputs.artifact_name }}
      mesa_version:
        value: ${{ jobs.build.outputs.mesa_version }}
      mesa_commit:
        value: ${{ jobs.build.outputs.mesa_commit }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      zip_name: ${{ steps.build.outputs.zip_name }}
      artifact_name: ${{ steps.artifact.outputs.name }}
      mesa_version: ${{ steps.build.outputs.mesa_version }}
      mesa_commit: ${{ steps.build.outputs.mesa_commit }}
    env:
      MESA_REPO: ${{ inputs.use_checkout && format('{0}/{1}', github.server_url, github.repository) || inputs.mesa_repo || 'https://gitlab.freedesktop.org/mesa/mesa.git' }}
      MESA_REF: ${{ inputs.use_checkout && (github.head_ref || github.ref_name) || inputs.mesa_ref || 'main' }}
      MESA_SRC: ${{ inputs.use_checkout && format('{0}/mesa', github.workspace) || '' }}
      PATCHES: ${{ inputs.patches }}
      VARIANT_NAME: ${{ inputs.variant_name || 'turnip-ci' }}
      NDK_VERSION: ${{ inputs.ndk || 'r28c' }}
      PACKAGE_VERSION: ${{ github.run_number }}
      WORKDIR: ${{ github.workspace }}/work
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - name: Checkout turnip-ci
        if: github.repository == 'GameNative/turnip-ci'
        uses: actions/checkout@v4
        with:
          path: turnip-ci

      - name: Checkout turnip-ci from caller
        if: github.repository != 'GameNative/turnip-ci'
        uses: actions/checkout@v4
        with:
          repository: GameNative/turnip-ci
          ref: ${{ inputs.turnip_ci_ref || 'main' }}
          token: ${{ secrets.turnip_ci_token || github.token }}
          path: turnip-ci

      - name: Checkout caller's Mesa tree
        if: inputs.use_checkout
        uses: actions/checkout@v4
        with:
          path: mesa

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build flex bison glslang-tools pkg-config zip unzip
          python3 -m pip install --user --upgrade meson mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        id: build
        run: ./turnip-ci/build.sh

      - name: Artifact name
        id: artifact
        env:
          NAME: ${{ inputs.artifact_name || steps.build.outputs.zip_name }}
        run: echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error
